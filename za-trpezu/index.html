const home=document.querySelector('#home'),detail=document.querySelector('#detail'),tiles=[...document.querySelectorAll('.tile')];

const plans={
 slava:{intro:'Primer mrsnog ručka sa pečenjem kao glavnim jelom. Unesite tačan broj odraslih. Količine su za posluživanje. Za pečenje sa kostima proverite kako ketering meri isporučenu težinu.',rows:[['Hladno predjelo',150],['Pečenje',300],['Sezonska salata',150],['Hleb ili proja',50],['Sitni kolači',50]],sources:[['Primer slavske porcije','https://www.dnevnik.rs/lat/vesti/drustvo/da-ne-obrukate-pred-gostima-poskupela-slavska-trpeza-evo-za-koji-iznos-treba-da-potrudite-2024-10-29'],['Salate','https://haloketering.com/koliko-hrane-po-osobi-za-slavu/'],['Hleb i proja','https://www.teambuilding-srbija.com/ketering/']]},
 zaloga:{intro:'Izaberite red prema trajanju prijema. Svaki red je zaseban predlog za ceo događaj.',rows:[['Kratak koktel',4,6],['Duži koktel bez ručka',8,12]],unit:'kom.',sources:[['Vodič za koktel','https://keteringbeograd.com/saveti/kanapei-i-sitni-zalogaji-za-dogadjaje/']]},
 voce:{intro:'Primer kada je voće jedini desert na kraćoj proslavi. Računamo očišćeno voće za posluživanje. Ako nudite i tortu, deo ove količine može da zameni torta.',rows:[['Sezonsko voće',100,150]],sources:[['Osnova procene za slatko posluženje','https://domaceiukusno.com/koliko-hrane-naruciti-po-osobi-za-proslave-kod-kuce/']]},
 deca:{intro:'Za rođendan od 2–3 sata unesite decu i odrasle odvojeno. U slatku porciju zajedno ulaze torta, kolači i voće.',rows:[['Slani zalogaji',100,150,200,250],['Slatko i voće',70,100,100,150]],sources:[['Porcije za decu i odrasle','https://domaceiukusno.com/koliko-hrane-naruciti-po-osobi-za-proslave-kod-kuce/']]}
};
const el=id=>document.getElementById(id), fmt=n=>n.toLocaleString('sr-Latn-RS',{maximumFractionDigits:3});
function span(lo,hi){return lo===hi?fmt(lo):fmt(lo)+'–'+fmt(hi)}
function calculate(){
 const key=location.hash.slice(1),plan=plans[key];if(!plan)return;
 const kids=key==='deca', n=el('n').valueAsNumber,a=kids?el('a').valueAsNumber:0;
 el('how').textContent=plan.intro;el('people').textContent=kids?'Broj dece':'Broj odraslih';el('adultwrap').hidden=!kids;
 
 el('sources').innerHTML='Izvori za procenu · '+plan.sources.map(([text,url])=>'<a href="'+url+'" target="_blank" rel="noopener">'+text+'</a>').join(' · ');
 if(![n,a].every(x=>Number.isSafeInteger(x)&&x>=0)||n+a<1){el('result').textContent='Unesite ceo broj gostiju (najmanje jedan ukupno).';return}
 const rows=plan.rows.map(([label,lo,hi=lo,al=0,ah=al])=>{
 const count=plan.unit==='kom.',unit=count?'kom.':'g',d=count?1:1000;
 return '<tr><td>'+label+'<br><small>'+span(lo,hi)+' '+unit+(kids?' po detetu · '+span(al,ah)+' g po odraslom':' po osobi')+'</small></td><td>'+span((n*lo+a*al)/d,(n*hi+a*ah)/d)+' '+(count?'kom.':'kg')+'</td></tr>'});
 el('result').innerHTML='<table><thead><tr><th>Posluženje</th><th>Za '+fmt(n+a)+' gostiju</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>';
}
for(const id of ['n','a'])el(id).addEventListener('input',calculate);

function show(){const tile=tiles.find(t=>t.hash===location.hash);home.hidden=!!tile;detail.hidden=!tile;if(tile){detail.querySelector('img').src=tile.querySelector('img').src;detail.querySelector('img').alt=tile.dataset.desc;detail.querySelector('h2').textContent=tile.textContent;detail.querySelector('.desc').textContent=tile.dataset.desc;calculate();detail.querySelector('h2').focus({preventScroll:true})}window.scrollTo(0,0)}window.addEventListener('hashchange',show);show();
</script></body></html>
